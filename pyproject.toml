[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patient-document-ocr-service"
version = "0.1.0"
description = "OCR intake service with patient-safe appointment notifications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/patient_document_ocr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
